<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Carrera Tracker - Tiempo Real</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100%; height: 100vh; }
        
        /* LA MAGIA: Esto hace que los iconos se deslicen suavemente y no salten */
        .leaflet-marker-icon {
            transition: transform 1s linear;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // 1. Inicializar el mapa centrado en Monterrey
        const map = L.map('map').setView([20.53, -97.45], 14);

        // Usar un mapa oscuro de CartoDB (Gratis y sin API Key)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        const corredores = {}; // Aquí guardamos los marcadores de los 15 participantes

        // 2. Conectarse a tu servidor Flask a través de tu túnel de Cloudflare
        // REEMPLAZA ESTO CON TU URL DE TRYCLOUDFLARE
        const socket = io("https://tu-tunel.trycloudflare.com");

        // 3. Escuchar el evento que manda Flask en el mismo milisegundo que ocurre
        socket.on('nueva_posicion', function(data) {
            console.log("Datos recibidos:", data);
            
            const latLng = [data.latitude, data.longitude];

            // Si el corredor ya está en el mapa, movemos su punto
            if (corredores[data.participante]) {
                corredores[data.participante].setLatLng(latLng);
            } 
            // Si es nuevo, le creamos su marcador
            else {
                const marker = L.marker(latLng).addTo(map);
                marker.bindPopup(`<b>${data.participante}</b><br>Velocidad: ${data.velocidad} m/s`);
                corredores[data.participante] = marker;
            }
        });
    </script>
</body>
</html>
