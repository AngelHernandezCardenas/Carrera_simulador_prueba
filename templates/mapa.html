<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Carrera Tracker - Panel de Control</title>
    
    <!-- Fuentes modernas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        :root {
            --bg-dark: #0b0f19;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --success: #10b981;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Interfaz tipo Glassmorphism */
        .dashboard {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 320px;
            max-height: calc(100vh - 40px);
            z-index: 1000;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 10px var(--success);
            animation: pulse 2s infinite;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
        }

        .runners-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Estilos de la barra de desplazamiento */
        .runners-list::-webkit-scrollbar {
            width: 6px;
        }
        .runners-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .runners-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        .runner-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .runner-card:hover, .runner-card.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .runner-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .runner-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            color: white;
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .runner-details {
            display: flex;
            flex-direction: column;
        }

        .runner-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
        }

        .runner-speed {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .runner-speed span {
            color: var(--success);
            font-weight: 600;
        }

        /* Animaciones para el mapa y marcadores */
        .leaflet-marker-icon {
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .custom-marker {
            width: 24px;
            height: 24px;
            background: var(--accent);
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .custom-marker.pulse-marker {
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        @keyframes ping {
            75%, 100% { transform: scale(2); opacity: 0; }
        }

        /* Estilo para los popups del mapa */
        .leaflet-popup-content-wrapper {
            background: var(--panel-bg);
            backdrop-filter: blur(8px);
            color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .leaflet-popup-tip {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
        }
        .leaflet-popup-content {
            font-family: 'Inter', sans-serif;
            margin: 12px 16px;
        }
        .popup-title { font-weight: 800; font-size: 14px; margin-bottom: 4px; color: var(--accent); }
        .popup-stat { font-size: 12px; color: #cbd5e1; }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="dashboard">
        <div class="header">
            <h1><div class="status-dot"></div> Telemetria</h1>
            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Corredores</div>
                    <div class="stat-value" id="total-runners">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Velocidad Max</div>
                    <div class="stat-value" id="max-speed">0.0</div>
                </div>
            </div>
        </div>
        <div class="runners-list" id="runners-list">
            <!-- Los corredores se insertaran aqui dinamicamente -->
        </div>
    </div>

    <script>
        // 1. Inicializacion del mapa
        const map = L.map('map', { zoomControl: false }).setView([20.53, -97.45], 14);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: 'Map data &copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        const state = {
            runners: {},
            maxSpeed: 0,
            firstPointReceived: false
        };

        const listContainer = document.getElementById('runners-list');

        // Generador de colores para distinguir corredores
        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4'];
        let colorIndex = 0;

        // 2. WebSockets
        const socket = io({
            path: '/socket.io',
            transports: ['polling', 'websocket']
        });

        socket.on('connect', () => console.log('Conectado al servidor de telemetria.'));

        socket.on('nueva_posicion', function (data) {
            const id = data.participante;
            const latLng = [data.latitude, data.longitude];
            const speed = Number(data.velocidad) || 0;

            // Actualizar estadisticas generales
            if (speed > state.maxSpeed) {
                state.maxSpeed = speed;
                document.getElementById('max-speed').textContent = speed.toFixed(1);
            }

            if (!state.runners[id]) {
                // Nuevo corredor
                const assignedColor = colors[colorIndex % colors.length];
                colorIndex++;
                
                const initials = id.replace(/participante_?/i, '').substring(0, 2).toUpperCase() || 'R';

                // Crear marcador en el mapa
                const iconHtml = `<div class="custom-marker" style="background: ${assignedColor}; box-shadow: 0 0 15px ${assignedColor}80;"></div>`;
                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [24, 24],
                    iconAnchor: [12, 12]
                });

                const marker = L.marker(latLng, { icon: customIcon }).addTo(map);
                
                // Crear elemento en la lista
                const card = document.createElement('div');
                card.className = 'runner-card';
                card.id = `card-${id}`;
                card.onclick = () => {
                    map.flyTo(latLng, 16, { animate: true, duration: 1.5 });
                    document.querySelectorAll('.runner-card').forEach(el => el.classList.remove('active'));
                    card.classList.add('active');
                };

                card.innerHTML = `
                    <div class="runner-info">
                        <div class="runner-avatar" style="background: linear-gradient(135deg, ${assignedColor}, #000); box-shadow: 0 4px 12px ${assignedColor}60;">${initials}</div>
                        <div class="runner-details">
                            <div class="runner-name">${id}</div>
                            <div class="runner-speed">Vel: <span id="speed-${id}">${speed.toFixed(1)}</span> km/h</div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);

                state.runners[id] = { marker, card, color: assignedColor };
                document.getElementById('total-runners').textContent = Object.keys(state.runners).length;

                // Auto-centrar en el primer corredor que mande datos
                if (!state.firstPointReceived) {
                    map.flyTo(latLng, 15, { animate: true });
                    state.firstPointReceived = true;
                }
            } else {
                // Corredor existente: Mover marcador
                const runner = state.runners[id];
                runner.marker.setLatLng(latLng);
                
                // Actualizar popup y UI
                document.getElementById(`speed-${id}`).textContent = speed.toFixed(1);
            }

            // Actualizar el contenido del Popup
            const r = state.runners[id];
            r.marker.bindPopup(`
                <div class="popup-title" style="color: ${r.color};">${id}</div>
                <div class="popup-stat">Velocidad: <b>${speed.toFixed(1)}</b> km/h</div>
                <div class="popup-stat">Coordenadas: ${data.latitude.toFixed(5)}, ${data.longitude.toFixed(5)}</div>
            `);
        });
    </script>
</body>
</html>
