<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>General Real-Time Scoreboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --border: #334155;
      --radius: 12px;
    }

    :root.light-mode {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
    }

    :root.light-mode th {
      background: rgba(0, 0, 0, 0.05);
    }

    :root.light-mode tr:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    :root.light-mode .rank-1 { color: #f59e0b; text-shadow: 1px 1px 2px rgba(245, 158, 11, 0.3); }
    :root.light-mode .rank-2 { color: #64748b; text-shadow: 1px 1px 2px rgba(100, 116, 139, 0.3); }
    :root.light-mode .rank-3 { color: #b45309; text-shadow: 1px 1px 2px rgba(180, 83, 9, 0.3); }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .pulse {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: rgba(255, 255, 255, 0.02);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 1px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .rank {
      font-weight: 900;
      font-size: 18px;
      color: var(--text-muted);
      width: 50px;
      text-align: center;
    }

    .rank-1 { color: #fbbf24; font-size: 24px; text-shadow: 0 0 10px rgba(251, 191, 36, 0.5); }
    .rank-2 { color: #94a3b8; font-size: 22px; }
    .rank-3 { color: #b45309; font-size: 20px; }

    .team-name {
      font-weight: bold;
      font-size: 16px;
    }

    .score-badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .checkpoints-list {
      font-family: monospace;
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-back {
      display: inline-block;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: var(--border);
      color: white;
    }

    .hamburger-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      margin-left: 10px;
      padding: 5px;
      vertical-align: middle;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .hamburger-btn:hover {
      color: var(--text);
    }
    
    .gallery-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.9);
      overflow-y: auto;
    }
    .gallery-modal-content {
      margin: 5% auto;
      padding: 20px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 90vw;
      position: relative;
    }
    .close-modal {
      color: var(--text-muted);
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-modal:hover {
      color: white;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }
    .gallery-grid img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
    }
    .fullscreen-viewer {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .fullscreen-viewer img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    .fs-close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }
      .header > div:last-child {
        width: 100%;
        justify-content: space-between;
      }
      h1 {
        font-size: 24px;
      }
      .panel {
        overflow-x: auto;
      }
      th, td {
        padding: 10px 8px;
        font-size: 13px;
        white-space: nowrap;
      }
      .rank {
        width: 30px;
        font-size: 15px;
      }
      .rank-1 { font-size: 20px; }
      .rank-2 { font-size: 18px; }
      .rank-3 { font-size: 16px; }
      .team-name {
        font-size: 14px;
      }
      .score-badge {
        font-size: 13px;
        padding: 4px 8px;
      }
      .gallery-modal-content {
        margin: 10% auto;
        padding: 15px;
        max-width: 95vw;
      }
      #singlePhotoView > div:first-child {
        flex-direction: column;
        gap: 10px;
      }
      #singlePhotoView > div:first-child button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div>
      <h1>Live Scoreboard</h1>
      <p style="color: var(--text-muted); margin: 5px 0 0 0;">Official real-time ranking</p>
    </div>
    <div style="display: flex; gap: 15px; align-items: center;">
      <button id="themeToggle" onclick="toggleTheme()" style="background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.2s;">☀️ Light Mode</button>
      <div class="status">
        <div class="pulse"></div>
        Live updating...
      </div>
    </div>
  </div>

  <div class="panel">
    <table>
      <thead>
        <tr>
          <th style="text-align: center;">Position</th>
          <th>Competitor</th>
          <th>Checkpoints Visited</th>
          <th style="text-align: center;">Current load</th>
          <th style="text-align: center;">Total load</th>
          <th style="text-align: right;">Total Score</th>
        </tr>
      </thead>
      <tbody id="scoreboardBody">
        <tr><td colspan="6" style="text-align: center; padding: 30px;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal para Galería de Fotos -->
<div id="photoModal" class="gallery-modal">
  <div class="gallery-modal-content">
    <span class="close-modal" onclick="closeModal()">&times;</span>
    <h2 id="modalTitle" style="margin-top: 0;">Photos of participant</h2>
    
    <!-- Gallery Grid View -->
    <div id="modalGallery" class="gallery-grid"></div>
    
    <!-- Single Photo View -->
    <div id="singlePhotoView" style="display: none; text-align: center; margin-top: 20px;">
      <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
        <button onclick="backToGallery()" style="padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
          &larr; Back to Gallery
        </button>
        <button id="toggleContoursBtn" onclick="toggleContours()" style="padding: 15px 30px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
          Hide Contours
        </button>
      </div>
      <div style="position: relative; display: inline-block; width: 100%;">
        <div id="imgScrollWrapper" style="width: 100%; max-height: 75vh; overflow: auto; border-radius: 8px; border: 2px solid var(--border);">
          <img id="singlePhotoImg" src="" onclick="toggleImageZoom(event)" style="width: 100%; height: auto; object-fit: contain; cursor: zoom-in; transition: width 0.3s ease;" title="Click to zoom in/out" />
        </div>
        <div onclick="openFullscreen(event)" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 20px; z-index: 10;" title="Open Fullscreen">&#x26F6;</div>
      </div>
      <p id="singlePhotoTimestamp" style="color: var(--text-muted); font-size: 14px; margin-top: 10px;"></p>
    </div>

  </div>
</div>

<!-- Visor en Pantalla Completa (720p) -->
<div id="fullscreenViewer" class="fullscreen-viewer" onclick="closeFullscreen(event)">
  <span class="fs-close-btn" onclick="forceCloseFullscreen()">&times;</span>
  <img id="fullscreenImg" src="" onclick="toggleFullscreenContour(event)" title="Click image to toggle contours" style="cursor: pointer;" />
</div>

<script>
  async function fetchScoreboard() {
    try {
      const res = await fetch('/api/scoreboard');
      const data = await res.json();
      
      if(data.participantes) {
        // Ordenar por puntaje mayor a menor
        let parts = data.participantes;
        parts.sort((a, b) => (b.total_score || 0) - (a.total_score || 0));
        
        const tbody = document.getElementById('scoreboardBody');
        tbody.innerHTML = '';
        
        parts.forEach((p, idx) => {
          // Filtrar equipos con 0 puntos si quieres, pero mostraremos todos
          const rank = idx + 1;
          let rankClass = '';
          if(rank === 1) rankClass = 'rank-1';
          else if(rank === 2) rankClass = 'rank-2';
          else if(rank === 3) rankClass = 'rank-3';
          
          const scoresDetails = p.scores || {};
          let checkpointsText = Object.keys(scoresDetails)
                                  .map(cp => `CP${cp}: ${scoresDetails[cp]}`)
                                  .join(', ') || 'None';
                                  
          const tr = document.createElement('tr');
          const encodedFotos = encodeURIComponent(JSON.stringify(p.todas_fotos || []));
          const btnHtml = (p.todas_fotos && p.todas_fotos.length > 0)
            ? `<button class="hamburger-btn" onclick="openModal('${p.nombre}', JSON.parse(decodeURIComponent('${encodedFotos}')))" title="View all photos">
                 <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                   <rect x="2" y="4" width="20" height="3.5" rx="1.75" />
                   <rect x="2" y="10.25" width="20" height="3.5" rx="1.75" />
                   <rect x="2" y="16.5" width="20" height="3.5" rx="1.75" />
                 </svg>
               </button>`
            : '';

          const imgHtml = p.ultima_foto 
            ? `<img src="/capturas/${p.ultima_foto}" alt="Photo" style="max-height: 40px; border-radius: 4px; object-fit: cover; cursor: pointer; vertical-align: middle;" onclick="openModal('${p.nombre}', JSON.parse(decodeURIComponent('${encodedFotos}')), '${p.ultima_foto}')">`
            : '<span style="color: var(--text-muted); font-size: 12px; vertical-align: middle;">No photo</span>';
            
          const cargaActualKg = typeof p.peso_kg === 'number' ? p.peso_kg.toFixed(2) : '0.00';
          const cargaTotalKg = typeof p.peso_entregado_kg === 'number' ? p.peso_entregado_kg.toFixed(2) : '0.00';

          tr.innerHTML = `
            <td class="rank ${rankClass}">${rank}</td>
            <td class="team-name">${p.equipo || p.nombre}</td>
            <td class="checkpoints-list">${checkpointsText}</td>
            <td style="text-align: center;">
              <span style="font-weight: bold; color: #10b981;">${cargaActualKg} kg</span>
            </td>
            <td style="text-align: center;">
              <span style="font-weight: bold; color: #f59e0b;">${cargaTotalKg} kg</span>
            </td>
            <td style="text-align: right;">
              <div class="score-badge">${p.total_score || 0} pts</div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
    } catch (e) {
      console.error("Error actualizando scoreboard:", e);
    }
  }

  // Funciones del Modal
  let currentSingleImage = "";
  let showingContours = true;
  let currentFotos = [];
  let isZoomed = false;

  function toggleImageZoom(event) {
    if (event) event.stopPropagation();
    isZoomed = !isZoomed;
    const img = document.getElementById('singlePhotoImg');
    if (isZoomed) {
      img.style.width = '150%';
      img.style.cursor = 'zoom-out';
    } else {
      img.style.width = '100%';
      img.style.cursor = 'zoom-in';
    }
  }

  function formatTimestamp(ts) {
    if (!ts) return "Unknown time";
    return new Date(ts * 1000).toLocaleString();
  }

  function openModal(nombre, fotos, singlePhoto = null) {
    const modal = document.getElementById('photoModal');
    const title = document.getElementById('modalTitle');
    const gallery = document.getElementById('modalGallery');
    const singleView = document.getElementById('singlePhotoView');
    
    currentFotos = fotos || [];
    title.textContent = 'All photos of ' + nombre;
    gallery.innerHTML = '';
    
    gallery.style.display = 'grid';
    singleView.style.display = 'none';
    
    if (currentFotos && currentFotos.length > 0) {
      currentFotos.forEach(item => {
        const fotoObj = typeof item === 'string' ? { filename: item, timestamp: null } : item;
        const div = document.createElement('div');
        div.style.textAlign = 'center';
        
        const img = document.createElement('img');
        img.src = '/capturas/' + fotoObj.filename;
        img.onclick = () => viewSinglePhoto(fotoObj.filename);
        
        const tsLabel = document.createElement('p');
        tsLabel.style.fontSize = '12px';
        tsLabel.style.color = 'var(--text-muted)';
        tsLabel.style.margin = '5px 0 0 0';
        tsLabel.textContent = formatTimestamp(fotoObj.timestamp);
        
        div.appendChild(img);
        div.appendChild(tsLabel);
        gallery.appendChild(div);
      });
    } else {
      gallery.style.display = 'block';
      gallery.innerHTML = '<p style="color: var(--text-muted);">No photos available.</p>';
    }
    
    modal.style.display = 'block';
    
    if (singlePhoto) {
      viewSinglePhoto(singlePhoto);
    }
  }

  function viewSinglePhoto(fotoFilename) {
    currentSingleImage = fotoFilename;
    const fotoObj = currentFotos.find(f => (typeof f === 'string' ? f : f.filename) === fotoFilename);
    if (fotoObj) {
      const ts = typeof fotoObj === 'string' ? null : fotoObj.timestamp;
      document.getElementById('singlePhotoTimestamp').textContent = formatTimestamp(ts);
    } else {
      document.getElementById('singlePhotoTimestamp').textContent = "";
    }
    showingContours = true;
    
    isZoomed = false;
    const img = document.getElementById('singlePhotoImg');
    if(img) {
      img.style.width = '100%';
      img.style.cursor = 'zoom-in';
    }
    
    document.getElementById('modalGallery').style.display = 'none';
    document.getElementById('singlePhotoView').style.display = 'block';
    
    updateSingleImageSource();
    const btn = document.getElementById('toggleContoursBtn');
    btn.textContent = 'Hide Contours';
    btn.style.background = '#ef4444';
  }
  
  function backToGallery() {
    document.getElementById('modalGallery').style.display = 'grid';
    document.getElementById('singlePhotoView').style.display = 'none';
  }
  
  function toggleContours() {
    showingContours = !showingContours;
    const btn = document.getElementById('toggleContoursBtn');
    
    if (showingContours) {
      btn.textContent = 'Hide Contours';
      btn.style.background = '#ef4444';
    } else {
      btn.textContent = 'Show Contours';
      btn.style.background = '#22c55e';
    }
    
    updateSingleImageSource();
  }
  
  function updateSingleImageSource() {
    const imgElement = document.getElementById('singlePhotoImg');
    if (showingContours) {
      imgElement.src = '/capturas/' + currentSingleImage;
    } else {
      imgElement.src = '/capturas/' + currentSingleImage.replace('.jpg', '_clean.jpg');
    }
  }

  function closeModal() {
    document.getElementById('photoModal').style.display = 'none';
  }
  
  // Cerrar al hacer clic fuera del contenido del modal
  window.onclick = function(event) {
    const modal = document.getElementById('photoModal');
    if (event.target == modal) {
      modal.style.display = 'none';
    }
  }

  // Funciones de Pantalla Completa
  function openFullscreen(event) {
    if (event) event.stopPropagation();
    const fsViewer = document.getElementById('fullscreenViewer');
    const fsImg = document.getElementById('fullscreenImg');
    const singlePhoto = document.getElementById('singlePhotoImg');
    fsImg.src = singlePhoto.src;
    fsViewer.style.display = 'flex';
  }
  
  function closeFullscreen(event) {
    if (event.target.id === 'fullscreenViewer') {
      document.getElementById('fullscreenViewer').style.display = 'none';
    }
  }

  function forceCloseFullscreen() {
    document.getElementById('fullscreenViewer').style.display = 'none';
  }

  function toggleFullscreenContour(event) {
    event.stopPropagation();
    toggleContours(); // Alterna la variable global y el src de singlePhotoImg
    const singlePhoto = document.getElementById('singlePhotoImg');
    document.getElementById('fullscreenImg').src = singlePhoto.src;
  }

  function toggleTheme() {
    document.documentElement.classList.toggle('light-mode');
    const btn = document.getElementById('themeToggle');
    if (document.documentElement.classList.contains('light-mode')) {
      btn.textContent = '🌙 Dark Mode';
    } else {
      btn.textContent = '☀️ Light Mode';
    }
  }

  // Actualizar cada 3 segundos
  setInterval(fetchScoreboard, 3000);
  fetchScoreboard();
</script>

</body>
</html>
