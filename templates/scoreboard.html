<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>General Real-Time Scoreboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --border: #334155;
      --radius: 12px;
    }

    :root.light-mode {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #475569;
      --border: #cbd5e1;
    }

    :root.light-mode th {
      background: rgba(0, 0, 0, 0.05);
    }

    :root.light-mode tr:hover {
      background: rgba(0, 0, 0, 0.02);
    }

    :root.light-mode .rank-1 {
      color: #f59e0b;
      text-shadow: 1px 1px 2px rgba(245, 158, 11, 0.3);
    }

    :root.light-mode .rank-2 {
      color: #64748b;
      text-shadow: 1px 1px 2px rgba(100, 116, 139, 0.3);
    }

    :root.light-mode .rank-3 {
      color: #b45309;
      text-shadow: 1px 1px 2px rgba(180, 83, 9, 0.3);
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .pulse {
      width: 10px;
      height: 10px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.2);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th,
    td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: rgba(255, 255, 255, 0.02);
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 1px;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .rank {
      font-weight: 900;
      font-size: 18px;
      color: var(--text-muted);
      width: 50px;
      text-align: center;
    }

    .rank-1 {
      color: #fbbf24;
      font-size: 24px;
      text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
    }

    .rank-2 {
      color: #94a3b8;
      font-size: 22px;
    }

    .rank-3 {
      color: #b45309;
      font-size: 20px;
    }

    .team-name {
      font-weight: bold;
      font-size: 16px;
    }

    .score-badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }

    .checkpoints-list {
      font-family: monospace;
      font-size: 13px;
      color: var(--text-muted);
    }

    .btn-back {
      display: inline-block;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-back:hover {
      background: var(--border);
      color: white;
    }

    .hamburger-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      margin-left: 10px;
      padding: 5px;
      vertical-align: middle;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .hamburger-btn:hover {
      color: var(--text);
    }

    .gallery-modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 23, 42, 0.9);
      overflow-y: auto;
    }

    .gallery-modal-content {
      margin: 5% auto;
      padding: 20px;
      background-color: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 90vw;
      position: relative;
    }

    .close-modal {
      color: var(--text-muted);
      float: right;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
    }

    .close-modal:hover {
      color: white;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .gallery-grid img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid var(--border);
    }

    .fullscreen-viewer {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    .fullscreen-viewer img {
      max-width: 95%;
      max-height: 95%;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    .fs-close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .header>div:last-child {
        width: 100%;
        justify-content: space-between;
      }

      h1 {
        font-size: 24px;
      }

      .panel {
        overflow-x: auto;
      }

      th,
      td {
        padding: 10px 8px;
        font-size: 13px;
        white-space: nowrap;
      }

      .rank {
        width: 30px;
        font-size: 15px;
      }

      .rank-1 {
        font-size: 20px;
      }

      .rank-2 {
        font-size: 18px;
      }

      .rank-3 {
        font-size: 16px;
      }

      .team-name {
        font-size: 14px;
      }

      .score-badge {
        font-size: 13px;
        padding: 4px 8px;
      }

      .gallery-modal-content {
        margin: 10% auto;
        padding: 15px;
        max-width: 95vw;
      }

      #singlePhotoView>div:first-child {
        flex-direction: column;
        gap: 10px;
      }

      #singlePhotoView>div:first-child button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div style="background: #1B2A47; padding: 12px; text-align: center; margin-bottom: 0;">
      <h1 style="margin: 0; color: white; font-size: 24px; letter-spacing: 2px; text-transform: uppercase;">Live Results</h1>
    </div>
    
    <div style="background: #0F8277; padding: 8px; text-align: center; margin-bottom: 0;">
      <h2 style="margin: 0; color: white; font-size: 16px; letter-spacing: 1px;">LEADING TEAM</h2>
    </div>

    <div style="background: white; border: 1px solid #cbd5e1; border-top: none; padding: 30px; text-align: center; margin-bottom: 20px;">
      <h1 id="leadTeamName" style="margin: 0 0 20px 0; font-size: 42px; color: #1e293b;">-</h1>
      <div style="display: flex; justify-content: center; gap: 40px; align-items: center;">
        <div>
          <div style="font-weight: bold; color: #0f172a; font-size: 18px; margin-bottom: 5px;">Loading</div>
          <div id="leadTeamLoading" style="font-size: 32px; font-weight: bold; color: #334155;">-</div>
        </div>
        <div style="background: #fef3c7; padding: 15px 30px; border-radius: 8px;">
          <div style="font-weight: bold; color: #b45309; font-size: 18px; margin-bottom: 5px;">POINTS</div>
          <div id="leadTeamPoints" style="font-size: 36px; font-weight: bold; color: #b45309;">-</div>
        </div>
      </div>
    </div>

    <div style="background: #1B2A47; padding: 12px; text-align: center; margin-bottom: 0;">
      <h1 style="margin: 0; color: white; font-size: 24px; letter-spacing: 2px; text-transform: uppercase;">Scoreboard</h1>
    </div>

    <div class="panel" style="border-radius: 0; border: 1px solid #cbd5e1; border-top: none;">
      <table style="width: 100%; border-collapse: collapse; text-align: center; background: white;">
        <thead>
          <tr style="background: #e2e8f0; border-bottom: 2px solid #cbd5e1;">
            <th style="padding: 12px; color: #1e293b; font-weight: bold; text-align: center;">Rank</th>
            <th style="padding: 12px; color: #1e293b; font-weight: bold; text-align: center;">Team</th>
            <th style="padding: 12px; color: #1e293b; font-weight: bold; text-align: center;">Load (%)</th>
            <th style="padding: 12px; color: #1e293b; font-weight: bold; text-align: center;">Energy (%)</th>
            <th style="padding: 12px; color: #1e293b; font-weight: bold; text-align: center;">Time (%)</th>
            <th style="padding: 12px; color: #1e293b; font-weight: bold; text-align: center;">Challenges (%)</th>
            <th style="padding: 12px; color: #1e293b; font-weight: bold; text-align: center;">Total (-/100)</th>
          </tr>
        </thead>
        <tbody id="scoreboardBody">
          <tr>
            <td colspan="7" style="text-align: center; padding: 30px; color: #475569;">Loading data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal para Galería de Fotos -->
  <div id="photoModal" class="gallery-modal">
    <div class="gallery-modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <h2 id="modalTitle" style="margin-top: 0;">Photos of participant</h2>

      <!-- Gallery Grid View -->
      <div id="modalGallery" class="gallery-grid"></div>

      <!-- Single Photo View -->
      <div id="singlePhotoView" style="display: none; text-align: center; margin-top: 20px;">
        <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
          <button onclick="backToGallery()"
            style="padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">
            &larr; Back to Gallery
          </button>
          <button id="toggleContoursBtn" onclick="toggleContours()"
            style="padding: 15px 30px; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            Hide Contours
          </button>
        </div>
        <div style="position: relative; display: inline-block; width: 100%;">
          <div id="imgScrollWrapper"
            style="width: 100%; max-height: 75vh; overflow: auto; border-radius: 8px; border: 2px solid var(--border);">
            <img id="singlePhotoImg" src="" onclick="toggleImageZoom(event)"
              style="width: 100%; height: auto; object-fit: contain; cursor: zoom-in; transition: width 0.3s ease;"
              title="Click to zoom in/out" />
          </div>
          <div onclick="openFullscreen(event)"
            style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-size: 20px; z-index: 10;"
            title="Open Fullscreen">&#x26F6;</div>
        </div>
        <p id="singlePhotoTimestamp" style="color: var(--text-muted); font-size: 14px; margin-top: 10px;"></p>
      </div>

    </div>
  </div>

  <!-- Visor en Pantalla Completa (720p) -->
  <div id="fullscreenViewer" class="fullscreen-viewer" onclick="closeFullscreen(event)">
    <span class="fs-close-btn" onclick="forceCloseFullscreen()">&times;</span>
    <img id="fullscreenImg" src="" onclick="toggleFullscreenContour(event)" title="Click image to toggle contours"
      style="cursor: pointer;" />
  </div>

  <script>
    let isGlobalRaceRunning = false;
    let globalRaceElapsedMs = 0;
    let lastSyncTimeMs = Date.now();

    function formatTimeMs(ms) {
      const timeS = Math.floor(ms / 1000);
      const h = Math.floor(timeS / 3600).toString().padStart(2, '0');
      const m = Math.floor((timeS % 3600) / 60).toString().padStart(2, '0');
      const s = (timeS % 60).toString().padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // Timer loop for smooth UI updates
    setInterval(() => {
      const elapsed = isGlobalRaceRunning
        ? globalRaceElapsedMs + (Date.now() - lastSyncTimeMs)
        : globalRaceElapsedMs;

      document.querySelectorAll('.race-timer').forEach(el => {
        const fallback = el.getAttribute('data-fallback-time');
        if (isGlobalRaceRunning || globalRaceElapsedMs > 0) {
          el.textContent = formatTimeMs(elapsed);
        } else {
          // use fallback if not started globally
          el.textContent = formatTimeMs((parseFloat(fallback) || 0) * 1000);
        }
      });
    }, 1000);

    async function fetchScoreboard() {
      try {
        const res = await fetch(`/api/scoreboard?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const payload = await res.json();
        const data = payload.participantes || [];

        const tbody = document.getElementById('scoreboardBody');
        tbody.innerHTML = '';

        if (data && data.length > 0) {
           const lead = data[0];
           document.getElementById('leadTeamName').textContent = lead["Team"] || lead.equipo || "-";
           document.getElementById('leadTeamLoading').textContent = formatPercent(lead["Load (%)"]);
           document.getElementById('leadTeamPoints').textContent = formatScore(lead["Total (-/100)"] ?? lead.total_score);
        }

        let renderedRows = 0;
        data.forEach((row) => {
          const rank = row["Rank"];
          if (!rank) return;

          const teamName = row["Team"] || row.equipo || "Unknown";
          const loadingPct = formatPercent(row["Load (%)"]);
          const energyPct = formatPercent(row["Energy (%)"]);
          const timeVal = formatPercent(row["Time (%)"]);
          const challengesPct = formatPercent(row["Challenges (%)"]);
          const totalScore = formatScore(row["Total (-/100)"] ?? row.total_score);

          renderedRows++;
          const isEven = renderedRows % 2 === 0;
          const bg = isEven ? '#f8fafc' : '#ffffff';

          const tr = document.createElement('tr');
          tr.style.background = bg;
          tr.style.borderBottom = '1px solid #e2e8f0';

          tr.innerHTML = `
          <td style="padding: 12px; font-weight: bold; color: #1e293b;">${rank}</td>
          <td style="padding: 12px; font-weight: bold; color: #334155;">${escapeHtml(teamName)}</td>
          <td style="padding: 12px; color: #475569;">${loadingPct}</td>
          <td style="padding: 12px; color: #475569;">${energyPct}</td>
          <td style="padding: 12px; color: #475569;">${timeVal}</td>
          <td style="padding: 12px; color: #475569;">${challengesPct}</td>
          <td style="padding: 12px; font-weight: bold; color: #0f172a; font-size: 1.1em;">${totalScore}</td>
          `;
          tbody.appendChild(tr);
        });

        if (renderedRows === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px;">No data found in Google Sheets.</td></tr>';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('scoreboardBody').innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 30px; color: #b91c1c;">Could not load scoreboard data.</td></tr>';
      }
    }

    function formatPercent(value) {
      let num = Number(value);
      if (!Number.isFinite(num)) return "0%";
      // Pandas can return fractions for percentages (e.g., 1.17 for 117%)
      // If the number is small (<= 5), assume it's a fraction and multiply by 100.
      if (Math.abs(num) <= 5) num *= 100;
      return `${num.toFixed(2).replace(/\.00$/, '')}%`;
    }

    function formatScore(value) {
      const num = Number(value);
      if (!Number.isFinite(num)) return "0";
      return num.toFixed(2).replace(/\.00$/, '');
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Funciones del Modal
    let currentSingleImage = "";
    let showingContours = true;
    let currentFotos = [];
    let isZoomed = false;

    function toggleImageZoom(event) {
      if (event) event.stopPropagation();
      isZoomed = !isZoomed;
      const img = document.getElementById('singlePhotoImg');
      if (isZoomed) {
        img.style.width = '150%';
        img.style.cursor = 'zoom-out';
      } else {
        img.style.width = '100%';
        img.style.cursor = 'zoom-in';
      }
    }

    function formatTimestamp(ts) {
      if (!ts) return "Unknown time";
      return new Date(ts * 1000).toLocaleString();
    }

    function openModal(nombre, fotos, singlePhoto = null) {
      const modal = document.getElementById('photoModal');
      const title = document.getElementById('modalTitle');
      const gallery = document.getElementById('modalGallery');
      const singleView = document.getElementById('singlePhotoView');

      currentFotos = fotos || [];
      title.textContent = 'All photos of ' + nombre;
      gallery.innerHTML = '';

      gallery.style.display = 'grid';
      singleView.style.display = 'none';

      if (currentFotos && currentFotos.length > 0) {
        currentFotos.forEach(item => {
          const fotoObj = typeof item === 'string' ? { filename: item, timestamp: null } : item;
          const div = document.createElement('div');
          div.style.textAlign = 'center';

          const img = document.createElement('img');
          img.src = '/capturas/' + fotoObj.filename;
          img.onclick = () => viewSinglePhoto(fotoObj.filename);

          const tsLabel = document.createElement('p');
          tsLabel.style.fontSize = '12px';
          tsLabel.style.color = 'var(--text-muted)';
          tsLabel.style.margin = '5px 0 0 0';
          tsLabel.textContent = formatTimestamp(fotoObj.timestamp);

          div.appendChild(img);
          div.appendChild(tsLabel);
          gallery.appendChild(div);
        });
      } else {
        gallery.style.display = 'block';
        gallery.innerHTML = '<p style="color: var(--text-muted);">No photos available.</p>';
      }

      modal.style.display = 'block';

      if (singlePhoto) {
        viewSinglePhoto(singlePhoto);
      }
    }

    function viewSinglePhoto(fotoFilename) {
      currentSingleImage = fotoFilename;
      const fotoObj = currentFotos.find(f => (typeof f === 'string' ? f : f.filename) === fotoFilename);
      if (fotoObj) {
        const ts = typeof fotoObj === 'string' ? null : fotoObj.timestamp;
        document.getElementById('singlePhotoTimestamp').textContent = formatTimestamp(ts);
      } else {
        document.getElementById('singlePhotoTimestamp').textContent = "";
      }
      showingContours = true;

      isZoomed = false;
      const img = document.getElementById('singlePhotoImg');
      if (img) {
        img.style.width = '100%';
        img.style.cursor = 'zoom-in';
      }

      document.getElementById('modalGallery').style.display = 'none';
      document.getElementById('singlePhotoView').style.display = 'block';

      updateSingleImageSource();
      const btn = document.getElementById('toggleContoursBtn');
      btn.textContent = 'Hide Contours';
      btn.style.background = '#ef4444';
    }

    function backToGallery() {
      document.getElementById('modalGallery').style.display = 'grid';
      document.getElementById('singlePhotoView').style.display = 'none';
    }

    function toggleContours() {
      showingContours = !showingContours;
      const btn = document.getElementById('toggleContoursBtn');

      if (showingContours) {
        btn.textContent = 'Hide Contours';
        btn.style.background = '#ef4444';
      } else {
        btn.textContent = 'Show Contours';
        btn.style.background = '#22c55e';
      }

      updateSingleImageSource();
    }

    function updateSingleImageSource() {
      const imgElement = document.getElementById('singlePhotoImg');
      if (showingContours) {
        imgElement.src = '/capturas/' + currentSingleImage;
      } else {
        imgElement.src = '/capturas/' + currentSingleImage.replace('.jpg', '_clean.jpg');
      }
    }

    function closeModal() {
      document.getElementById('photoModal').style.display = 'none';
    }

    // Cerrar al hacer clic fuera del contenido del modal
    window.onclick = function (event) {
      const modal = document.getElementById('photoModal');
      if (event.target == modal) {
        modal.style.display = 'none';
      }
    }

    // Funciones de Pantalla Completa
    function openFullscreen(event) {
      if (event) event.stopPropagation();
      const fsViewer = document.getElementById('fullscreenViewer');
      const fsImg = document.getElementById('fullscreenImg');
      const singlePhoto = document.getElementById('singlePhotoImg');
      fsImg.src = singlePhoto.src;
      fsViewer.style.display = 'flex';
    }

    function closeFullscreen(event) {
      if (event.target.id === 'fullscreenViewer') {
        document.getElementById('fullscreenViewer').style.display = 'none';
      }
    }

    function forceCloseFullscreen() {
      document.getElementById('fullscreenViewer').style.display = 'none';
    }

    function toggleFullscreenContour(event) {
      event.stopPropagation();
      toggleContours(); // Alterna la variable global y el src de singlePhotoImg
      const singlePhoto = document.getElementById('singlePhotoImg');
      document.getElementById('fullscreenImg').src = singlePhoto.src;
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('light-mode');
      const btn = document.getElementById('themeToggle');
      if (document.documentElement.classList.contains('light-mode')) {
        btn.textContent = '🌙 Dark Mode';
        localStorage.setItem('scoreboard-theme', 'light');
      } else {
        btn.textContent = '☀️ Light Mode';
        localStorage.setItem('scoreboard-theme', 'dark');
      }
    }

    // Initialize theme: default is light
    (function ensureThemeToggleTarget() {
      if (!document.getElementById('themeToggle')) {
        const themeToggle = document.createElement('span');
        themeToggle.id = 'themeToggle';
        themeToggle.style.display = 'none';
        document.body.appendChild(themeToggle);
      }
    })();

    (function initTheme() {
      const saved = localStorage.getItem('scoreboard-theme');
      if (saved === 'dark') {
        document.documentElement.classList.remove('light-mode');
        document.getElementById('themeToggle').textContent = '☀️ Light Mode';
      } else {
        // Explicitly ensure light mode, regardless of system preference
        document.documentElement.classList.add('light-mode');
        document.getElementById('themeToggle').textContent = '🌙 Dark Mode';
      }
    })();

    // Actualizar cada 3 segundos
    setInterval(fetchScoreboard, 3000);
    fetchScoreboard();
  </script>

</body>

</html>
