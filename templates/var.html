<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAR — Capture Verification</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; min-height: 100vh; }

        .header {
            background: linear-gradient(135deg, #1e40af, #7c3aed);
            padding: 24px 32px; display: flex; justify-content: space-between; align-items: center;
        }
        .header h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
        .header .sub { color: rgba(255,255,255,.65); font-size: 13px; margin-top: 4px; }
        .header-badge {
            background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.2);
            border-radius: 8px; padding: 8px 16px; font-size: 14px; font-weight: 700;
        }

        .filters {
            background: #1e293b; border-bottom: 1px solid #334155;
            padding: 14px 24px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
        }
        .filters select {
            padding: 8px 12px; border-radius: 8px; border: 1px solid #475569;
            background: #0f172a; color: #f8fafc; font-size: 14px; cursor: pointer;
        }
        .filters input[type="text"] {
            padding: 8px 12px; border-radius: 8px; border: 1px solid #475569;
            background: #0f172a; color: #f8fafc; font-size: 14px; min-width: 200px;
        }
        .filters label { font-size: 13px; color: #94a3b8; font-weight: 600; }

        .stats-bar {
            background: #1e293b; padding: 10px 24px;
            display: flex; gap: 24px; border-bottom: 1px solid #334155;
        }
        .stat { font-size: 13px; color: #94a3b8; }
        .stat b { color: #f8fafc; }

        .gallery {
            padding: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: #1e293b; border: 1px solid #334155; border-radius: 14px;
            overflow: hidden; transition: transform .15s, box-shadow .15s; cursor: pointer;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,.5); }

        .card-img-wrap {
            position: relative; background: #000; height: 200px; overflow: hidden;
        }
        .card-img-wrap img {
            width: 100%; height: 100%; object-fit: cover; display: block;
            transition: transform .2s;
        }
        .card:hover .card-img-wrap img { transform: scale(1.03); }

        /* Badges sobre la imagen */
        .badge-cp {
            position: absolute; top: 10px; left: 10px;
            background: #2563eb; color: white; font-size: 11px; font-weight: 800;
            padding: 4px 8px; border-radius: 6px; letter-spacing: .3px;
        }
        .badge-time {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(0,0,0,.7); color: #cbd5e1; font-size: 10px;
            padding: 3px 7px; border-radius: 5px;
        }
        .var-ok {
            position: absolute; top: 10px; right: 10px;
            background: #16a34a; color: white; font-size: 11px; font-weight: 900;
            padding: 4px 8px; border-radius: 6px;
        }
        .var-warn {
            position: absolute; top: 10px; right: 10px;
            background: #d97706; color: white; font-size: 11px; font-weight: 900;
            padding: 4px 8px; border-radius: 6px;
        }

        .card-body { padding: 14px; }
        .card-participant { font-size: 16px; font-weight: 800; margin-bottom: 4px; color: #f8fafc; }
        .card-judge { font-size: 12px; color: #94a3b8; margin-bottom: 10px; }
        .balls-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .ball-tag {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 700;
        }
        .ball-tag.red   { background: #ef44441a; color: #ef4444; border: 1px solid #ef444430; }
        .ball-tag.white { background: #f8fafc;   color: #475569; border: 1px solid #cbd5e1; }
        .ball-tag.black { background: #11111130; color: #94a3b8; border: 1px solid #33415530; }
        .ball-tag.zero  { opacity: .35; }
        .weight-pill {
            margin-top: 10px; background: #16a34a20; border: 1px solid #16a34a40;
            color: #4ade80; font-size: 14px; font-weight: 900;
            padding: 5px 12px; border-radius: 20px; display: inline-block;
        }
        .weight-pill.zero { background: #47556920; border-color: #47556940; color: #64748b; }

        /* Visor */
        .viewer-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,.95);
            z-index: 1000; flex-direction: column;
        }
        .viewer-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: rgba(255,255,255,.05);
            border-bottom: 1px solid #334155;
        }
        .viewer-toolbar button {
            background: #334155; border: 0; color: white; padding: 8px 16px;
            border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px;
        }
        .viewer-toolbar button:hover { background: #475569; }
        .viewer-toolbar button.close { background: #dc2626; }
        .viewer-info {
            padding: 10px 20px; background: #1e293b;
            font-size: 13px; color: #94a3b8; border-bottom: 1px solid #334155;
            display: flex; gap: 16px; flex-wrap: wrap;
        }
        .viewer-info b { color: #f8fafc; }
        .viewer-img-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            overflow: auto; padding: 20px;
        }
        .viewer-img-area img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform .2s; }

        #emptyMsg {
            grid-column: 1/-1; text-align: center; padding: 60px 20px;
            color: #475569; font-size: 18px;
        }

        /* Scroll to top */
        #scrollTop {
            position: fixed; bottom: 24px; right: 24px; width: 46px; height: 46px;
            background: #2563eb; border: 0; color: white; border-radius: 50%;
            font-size: 20px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.4);
            display: none;
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>🎬 VAR — Capture Verification</h1>
        <div class="sub">Review and validation of images registered by judges</div>
    </div>
    <div class="header-badge" id="totalBadge">0 photos</div>
</div>

<div class="filters">
    <label>Filter by:</label>
    <input type="text" id="searchParticipant" placeholder="🔍 Participant or judge..." oninput="applyFilters()">
    <select id="filterCheckpoint" onchange="applyFilters()">
        <option value="">All checkpoints</option>
    </select>
    <select id="filterSort" onchange="applyFilters()">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="weight">Heaviest first</option>
        <option value="participant">By participant</option>
    </select>
    <button onclick="loadGallery()" style="background:#2563eb;color:white;border:0;padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;">
        🔄 Update
    </button>
</div>

<div class="stats-bar" id="statsBar">
    <div class="stat">📸 Total: <b id="totalPhotos">0</b></div>
    <div class="stat">👥 Participants: <b id="totalParticipants">0</b></div>
    <div class="stat">⚖️ Total registered weight: <b id="totalWeight">0.00 kg</b></div>
    <div class="stat">📍 Checkpoints with photo: <b id="totalCheckpoints">0</b></div>
</div>

<div class="gallery" id="gallery">
    <div id="emptyMsg">Loading photos...</div>
</div>

<!-- Visor de imágenes -->
<div class="viewer-overlay" id="viewerOverlay">
    <div class="viewer-toolbar">
        <div style="display:flex;gap:8px;">
            <button onclick="viewerZoom(0.3)">＋ Zoom</button>
            <button onclick="viewerZoom(-0.3)">－ Zoom</button>
            <button onclick="viewerReset()">🔍 Original size</button>
            <button id="toggleContourBtn" onclick="toggleViewerContour()">Remove outline</button>
        </div>
        <button class="close" onclick="closeViewer()">✕ Close</button>
    </div>
    <div class="viewer-info" id="viewerInfo"></div>
    <div class="viewer-img-area" id="viewerImgArea">
        <img id="viewerImg" src="" alt="Captura">
    </div>
</div>

<button id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<script>
let allPhotos = [];
let viewerContour = true;
let viewerCurrentFile = "";
let viewerScale = 1;

// ── CARGAR GALERIA ────────────────────────────────────
async function loadGallery() {
    document.getElementById("emptyMsg").style.display = "block";
    document.getElementById("emptyMsg").textContent = "Cargando fotos…";
    document.getElementById("gallery").innerHTML = '<div id="emptyMsg">Loading photos...</div>';

    try {
        const resp = await fetch("/galeria");
        allPhotos = await resp.json();
    } catch(e) {
        document.getElementById("gallery").innerHTML = `<div id="emptyMsg" style="color:#ef4444;">Connection error: ${e.message}</div>`;
        return;
    }

    // Poblar filtro de checkpoints
    const cpSelect = document.getElementById("filterCheckpoint");
    const cpSet = new Set();
    allPhotos.forEach(p => {
        if (p.checkpoint_nombre) cpSet.add(p.checkpoint_nombre);
        else if (p.checkpoint_id) cpSet.add("Checkpoint " + p.checkpoint_id);
    });
    cpSelect.innerHTML = '<option value="">All checkpoints</option>';
    [...cpSet].sort().forEach(cp => {
        const opt = document.createElement("option");
        opt.value = cp; opt.textContent = cp;
        cpSelect.appendChild(opt);
    });

    applyFilters();
}

// ── FILTROS ───────────────────────────────────────────
function applyFilters() {
    const search = document.getElementById("searchParticipant").value.toLowerCase();
    const cpFilter = document.getElementById("filterCheckpoint").value;
    const sortMode = document.getElementById("filterSort").value;

    let filtered = allPhotos.filter(p => {
        const name = String(p.participante || p.device_id || "").toLowerCase();
        const juez = String(p.juez || "").toLowerCase();
        const cp   = p.checkpoint_nombre || (p.checkpoint_id ? "Checkpoint " + p.checkpoint_id : "");
        const matchSearch = !search || name.includes(search) || juez.includes(search);
        const matchCp = !cpFilter || cp === cpFilter;
        return matchSearch && matchCp;
    });

    // Ordenar
    if (sortMode === "newest")  filtered.sort((a,b) => b.timestamp - a.timestamp);
    if (sortMode === "oldest")  filtered.sort((a,b) => a.timestamp - b.timestamp);
    if (sortMode === "weight")  filtered.sort((a,b) => calcWeight(b.detections) - calcWeight(a.detections));
    if (sortMode === "participant") filtered.sort((a,b) => String(a.participante||"").localeCompare(String(b.participante||"")));

    renderGallery(filtered);
}

function calcWeight(det) {
    if (!det) return 0;
    return (det.Rojo||0)*1 + (det.Blanco||0)*5 + (det.Negro||0)*3;
}

// ── RENDERIZAR ────────────────────────────────────────
function renderGallery(photos) {
    const gallery = document.getElementById("gallery");
    document.getElementById("totalBadge").textContent = photos.length + " fotos";
    document.getElementById("totalPhotos").textContent = photos.length;

    const participants = new Set(photos.map(p => p.participante || p.device_id));
    document.getElementById("totalParticipants").textContent = participants.size;

    const totalKg = photos.reduce((acc, p) => acc + calcWeight(p.detections), 0);
    document.getElementById("totalWeight").textContent = totalKg.toFixed(2) + " kg";

    const checkpoints = new Set(photos.map(p => p.checkpoint_nombre || (p.checkpoint_id ? "CP"+p.checkpoint_id : null)).filter(Boolean));
    document.getElementById("totalCheckpoints").textContent = checkpoints.size;

    if (photos.length === 0) {
        gallery.innerHTML = '<div id="emptyMsg">No photos match the filters.</div>';
        return;
    }

    gallery.innerHTML = photos.map((item, idx) => {
        const name = String(item.participante || item.device_id || "Unknown").replace(/participante_?/i, "Participante ");
        const cp   = item.checkpoint_nombre || (item.checkpoint_id ? `Checkpoint ${item.checkpoint_id}` : "No checkpoint");
        const dt   = new Date(item.timestamp * 1000).toLocaleString("es-MX");
        const det  = item.detections || {};
        const kg   = calcWeight(det);

        // Badges de pelota
        const rTag = `<span class="ball-tag red${det.Rojo?'':' zero'}">🔴 ${det.Rojo||0}</span>`;
        const wTag = `<span class="ball-tag white${det.Blanco?'':' zero'}">⚪ ${det.Blanco||0}</span>`;
        const bTag = `<span class="ball-tag black${det.Negro?'':' zero'}">⚫ ${det.Negro||0}</span>`;

        const varBadge = kg > 0
            ? `<div class="var-ok">✓ VAR</div>`
            : `<div class="var-warn">⚠ No weight</div>`;

        return `
        <div class="card" onclick="openViewer(${idx})">
            <div class="card-img-wrap">
                <img src="/capturas/${item.filename}" alt="Captura ${idx+1}" loading="lazy">
                <div class="badge-cp">${cp}</div>
                <div class="badge-time">${dt}</div>
                ${varBadge}
            </div>
            <div class="card-body">
                <div class="card-participant">${name}</div>
                <div class="card-judge">Judge: ${item.juez || "Unknown"}</div>
                <div class="balls-row">${rTag}${wTag}${bTag}</div>
                <div class="${kg>0?'weight-pill':'weight-pill zero'}">${kg.toFixed(2)} kg</div>
            </div>
        </div>`;
    }).join("");
}

// ── VISOR MODO VAR ────────────────────────────────────
let currentFilteredPhotos = [];

function openViewer(idx) {
    // Rebuild filtered list at time of click
    const search = document.getElementById("searchParticipant").value.toLowerCase();
    const cpFilter = document.getElementById("filterCheckpoint").value;
    let filtered = allPhotos.filter(p => {
        const name = String(p.participante||p.device_id||"").toLowerCase();
        const juez = String(p.juez||"").toLowerCase();
        const cp   = p.checkpoint_nombre||(p.checkpoint_id?"Checkpoint "+p.checkpoint_id:"");
        return (!search||name.includes(search)||juez.includes(search)) && (!cpFilter||cp===cpFilter);
    });
    currentFilteredPhotos = filtered;

    const item = filtered[idx];
    if (!item) return;

    viewerContour = true;
    viewerScale = 1;
    viewerCurrentFile = item.filename;

    const name = String(item.participante||item.device_id||"Unknown").replace(/participante_?/i,"Participante ");
    const cp   = item.checkpoint_nombre||(item.checkpoint_id?`Checkpoint ${item.checkpoint_id}`:"No checkpoint");
    const dt   = new Date(item.timestamp*1000).toLocaleString("es-MX");
    const det  = item.detections||{};
    const kg   = calcWeight(det);

    document.getElementById("viewerInfo").innerHTML = `
        <span>👤 <b>${name}</b></span>
        <span>📍 <b>${cp}</b></span>
        <span>⚖️ <b>${kg.toFixed(2)} kg</b></span>
        <span>🔴 ${det.Rojo||0} | ⚪ ${det.Blanco||0} | ⚫ ${det.Negro||0}</span>
        <span>🕐 ${dt}</span>
        <span>Judge: ${item.juez||"?"}</span>
    `;

    document.getElementById("viewerImg").src = "/capturas/" + item.filename;
    document.getElementById("viewerImg").style.transform = "scale(1)";
    document.getElementById("viewerOverlay").style.display = "flex";
    document.getElementById("toggleContourBtn").textContent = "Remove outline";
}

function closeViewer() { document.getElementById("viewerOverlay").style.display = "none"; }
function toggleViewerContour() {
    viewerContour = !viewerContour;
    document.getElementById("viewerImg").src = "/capturas/" + (viewerContour ? viewerCurrentFile : viewerCurrentFile.replace(".jpg","_clean.jpg"));
    document.getElementById("toggleContourBtn").textContent = viewerContour ? "Remove outline" : "Show outline";
}
function viewerZoom(d) {
    viewerScale = Math.max(0.3, Math.min(5, viewerScale+d));
    document.getElementById("viewerImg").style.transform = `scale(${viewerScale})`;
    document.getElementById("viewerImgArea").style.overflow = viewerScale > 1 ? "auto" : "hidden";
}
function viewerReset() {
    viewerScale = 1;
    document.getElementById("viewerImg").style.transform = "scale(1)";
    document.getElementById("viewerImgArea").style.overflow = "hidden";
}

// Tecla ESC para cerrar
document.addEventListener("keydown", e => { if(e.key==="Escape") closeViewer(); });

// Scroll to top btn
window.addEventListener("scroll", () => {
    document.getElementById("scrollTop").style.display = window.scrollY > 400 ? "block" : "none";
});

// Auto-actualizar cada 30s
loadGallery();
setInterval(loadGallery, 30000);
</script>
</body>
</html>
